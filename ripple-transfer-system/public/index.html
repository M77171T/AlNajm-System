<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام النجم | تحويل XRP</title>
    <script src="https://unpkg.com/xrpl@2.2.3/dist/xrpl-latest-min.js"></script>
    <style>
        body { background: #000; color: #d4af37; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { border: 2px solid #d4af37; padding: 20px; border-radius: 20px; background: #111; max-width: 500px; margin: auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #d4af37; background: #222; color: #fff; }
        button { background: #d4af37; color: #000; border: none; padding: 15px 30px; cursor: pointer; font-weight: bold; border-radius: 10px; width: 100%; }
        .result { margin-top: 20px; padding: 10px; border: 1px dashed #d4af37; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🌟 نظام النجم للحوالات 🌟</h1>
        
        <div id="setup">
            <p>أدخل مفتاحك السري للبدء:</p>
            <input type="password" id="secretKey" placeholder="المفتاح السري (Seed)">
            <button onclick="connectWallet()">تسجيل الدخول للمحفظة</button>
        </div>

        <div id="transfer-section" style="display:none;">
            <p>رصيدك الحالي: <span id="balance">0</span> XRP</p>
            <hr>
            <input type="text" id="destAddr" placeholder="عنوان المستلم (r...)">
            <input type="number" id="amount" placeholder="المبلغ">
            <button id="sendBtn" onclick="sendXRP()">إرسال الحوالة الآن 🚀</button>
        </div>
        
        <div id="log" class="result" style="display:none;"></div>
    </div>

    <script>
        let wallet;
        const client = new xrpl.Client("wss://s.altnet.rippletest.net:51233");

        async function connectWallet() {
            const secret = document.getElementById("secretKey").value;
            try {
                wallet = xrpl.Wallet.fromSeed(secret);
                await client.connect();
                const response = await client.request({ command: "account_info", account: wallet.address, ledger_index: "validated" });
                document.getElementById("balance").innerText = xrpl.dropsToXrp(response.result.account_data.Balance);
                document.getElementById("setup").style.display = "none";
                document.getElementById("transfer-section").style.display = "block";
            } catch (e) { alert("المفتاح السري غير صحيح أو المحفظة غير مفعلة"); }
        }

        async function sendXRP() {
            const dest = document.getElementById("destAddr").value;
            const amount = document.getElementById("amount").value;
            const log = document.getElementById("log");
            
            log.style.display = "block";
            log.innerText = "جاري معالجة الحوالة... ⏳";

            try {
                const prepared = await client.autofill({
                    "TransactionType": "Payment",
                    "Account": wallet.address,
                    "Amount": xrpl.xrpToDrops(amount),
                    "Destination": dest
                });
                const signed = wallet.sign(prepared);
                const tx = await client.submitAndWait(signed.tx_blob);
                
                if (tx.result.meta.TransactionResult === "tesSUCCESS") {
                    log.innerHTML = `<span style="color:green">✅ تمت الحوالة بنجاح!</span><br>رقم العملية: ${tx.result.hash}`;
                } else {
                    log.innerHTML = `<span style="color:red">❌ فشلت العملية: ${tx.result.meta.TransactionResult}</span>`;
                }
            } catch (e) { log.innerText = "خطأ: " + e.message; }
        }
    </script>
</body>
</html>
