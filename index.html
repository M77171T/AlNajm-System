<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
body { background: #000; color: #d4af37; text-align: center; font-family: sans-serif; }
.card { border: 2px solid #d4af37; padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 400px; }
input { background: #111; color: #fff; border: 1px solid #d4af37; padding: 10px; width: 80%; margin: 5px; }
button { background: #d4af37; color: #000; font-weight: bold; padding: 10px; width: 85%; border: none; }
</style>
</head>
<body>
<div class="card">
<h1>🔒 نظام النجم الذهبي</h1>
<div id="total" style="font-size: 35px; color: #fff;">0$</div>
<input id="n" placeholder="الاسم"><input id="a" type="number" placeholder="المبلغ">
<button onclick="add()">حفظ في الخزنة</button>
<div id="l" style="text-align: right; margin-top: 15px;"></div>
</div>
<script>
async function load() {
const r = await fetch('/data'); const d = await r.json();
let t = 0; document.getElementById('l').innerHTML = '';
d.forEach(i => {
t += parseFloat(i.amount);
document.getElementById('l').innerHTML += `<div>${i.name}: ${i.amount}$ ✅</div>`;
});
document.getElementById('total').innerText = t + '$';
}
async function add() {
const n = document.getElementById('n').value; const a = document.getElementById('a').value;
await fetch('/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name: n, amount: a }) });
load();
}
load();
</script>
</body>
</html>
